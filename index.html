<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Working Targets & Operations Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  <!-- TOP HEADER WITH REFRESH BUTTON -->
  <header class="bg-red-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-base sm:text-lg font-black tracking-tight">Working Targets & Operations Portal</h1>
        <p class="text-[11px] text-red-100">Live UDCP Hospital Links • Role-Based Access</p>
      </div>

      <div class="flex flex-wrap items-center gap-2 text-xs">
        <select id="roleSelect" onchange="manualRefreshPortal()" class="bg-white text-slate-900 font-bold px-2.5 py-1.5 rounded-lg">
          <option value="ADMIN">ADMIN</option>
          <option value="OPERATOR">OPERATOR</option>
          <option value="FIELD">FIELD</option>
          <option value="ASSOCIATE">ASSOCIATE</option>
        </select>

        <input id="userIdInput" type="text" value="9235268271" placeholder="User ID"
          onchange="manualRefreshPortal()"
          class="bg-white text-slate-900 font-semibold px-2.5 py-1.5 rounded-lg w-28" />

        <input id="sheetColInput" type="text" value="ABHISEK" placeholder="Sheet Col"
          onchange="manualRefreshPortal()"
          class="bg-white text-slate-900 font-semibold px-2.5 py-1.5 rounded-lg w-24" />

        <input id="dateInput" type="date" onchange="manualRefreshPortal()"
          class="bg-white text-slate-900 font-semibold px-2.5 py-1.5 rounded-lg" />

        <!-- MANUAL REFRESH BUTTON -->
        <button id="refreshBtn" type="button" onclick="manualRefreshPortal()"
          class="bg-amber-400 hover:bg-amber-300 text-red-950 font-extrabold px-3 py-1.5 rounded-lg shadow transition inline-flex items-center gap-1">
          <span id="refreshBtnIcon">↻</span>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-1 space-y-4">
    <div class="flex items-center justify-between text-xs text-slate-600">
      <span id="statusSummaryText">Ready</span>
      <span id="lastSyncedText" class="font-mono text-[11px] text-slate-500"></span>
    </div>

    <div id="chipsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
  </main>

  <!-- DETAIL MODAL WITH 🔗 OPEN UDCP TRACKER -->
  <div id="detailModal" class="hidden fixed inset-0 bg-slate-900/70 z-40 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 space-y-4">
      <div class="flex items-start justify-between border-b pb-3">
        <div>
          <span id="mdlHospIdBadge" class="text-[11px] font-mono font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded"></span>
          <h2 id="mdlHospitalName" class="text-lg font-black text-slate-900 mt-1"></h2>
          <p id="mdlMetaText" class="text-xs text-slate-500"></p>
        </div>
        <button type="button" onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold leading-none">&times;</button>
      </div>

      <div id="mdlRemarkBox" class="text-xs bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-700"></div>

      <div id="mdlExternalLinks" class="hidden flex flex-wrap items-center gap-2 pt-1">
        <a id="mdlUdcpBtn" href="#" target="_blank" rel="noopener noreferrer"
          class="hidden bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold px-4 py-2.5 rounded-xl shadow inline-flex items-center gap-1.5 transition">
          🔗 Open UDCP Tracker ↗
        </a>
        <a id="mdlDriveBtn" href="#" target="_blank" rel="noopener noreferrer"
          class="hidden bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow inline-flex items-center gap-1.5 transition">
          📁 Open Drive Folder ↗
        </a>
      </div>
    </div>
  </div>

  <!-- CORNER SPINNER (SILENT BACKGROUND SYNC INDICATOR) -->
  <div id="cornerSyncSpinner"
       title="Syncing in background..."
       class="hidden fixed bottom-4 right-4 z-50 w-9 h-9 rounded-full bg-white border border-slate-300 shadow-lg flex items-center justify-center pointer-events-none">
    <span class="w-4 h-4 rounded-full border-2 border-slate-200 border-t-red-600 animate-spin"></span>
  </div>

  <script>
    // Replace with your Working Targets Web App Exec URL
    const WORKING_TARGETS_API_URL = "https://script.google.com/macros/s/AKfycbzdPsjzKLEShlSGaH9iGB6W6eOxKyvew3KpAONrNIcE6D3v0kV-1X1PfR6K1ZcbvKkfqA/exec";
    const BACKGROUND_SYNC_MS = 45000;

    let currentItems = [];
    let isSyncing = false;

    function setCornerSpinner(visible) {
      const spinner = document.getElementById("cornerSyncSpinner");
      if (!spinner) return;
      spinner.classList.toggle("hidden", !visible);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getFilterParams() {
      return {
        role: document.getElementById("roleSelect").value,
        userId: document.getElementById("userIdInput").value.trim(),
        sheetColumn: document.getElementById("sheetColInput").value.trim().toUpperCase(),
        date: document.getElementById("dateInput").value
      };
    }

    async function fetchPortalData({ silent = false } = {}) {
      if (isSyncing) return;
      isSyncing = true;

      const btn = document.getElementById("refreshBtn");
      const icon = document.getElementById("refreshBtnIcon");

      if (silent) {
        setCornerSpinner(true);
      } else {
        if (btn) btn.disabled = true;
        if (icon) icon.classList.add("inline-block", "animate-spin");
        document.getElementById("statusSummaryText").innerText = "Refreshing...";
      }

      try {
        const p = getFilterParams();
        const qs = new URLSearchParams({
          action: "getPortalData",
          role: p.role,
          userId: p.userId,
          sheetColumn: p.sheetColumn,
          date: p.date
        }).toString();

        const res = await fetch(`${WORKING_TARGETS_API_URL}?${qs}`, { method: "GET" });
        const json = await res.json();

        if (json && json.status === "ok" && json.data) {
          currentItems = Array.isArray(json.data.items) ? json.data.items : [];
          renderChips();
          document.getElementById("statusSummaryText").innerText = `Showing ${currentItems.length} item(s)`;
          document.getElementById("lastSyncedText").innerText = "Synced: " + new Date().toLocaleTimeString();
        } else if (!silent) {
          document.getElementById("statusSummaryText").innerText = (json && json.message) || "Unable to load data.";
        }
      } catch (err) {
        if (!silent) {
          document.getElementById("statusSummaryText").innerText = "Sync error: " + err.message;
        }
      } finally {
        isSyncing = false;
        if (silent) {
          setCornerSpinner(false);
        } else {
          if (btn) btn.disabled = false;
          if (icon) icon.classList.remove("animate-spin");
        }
      }
    }

    function manualRefreshPortal() {
      fetchPortalData({ silent: false });
    }

    function renderChips() {
      const container = document.getElementById("chipsContainer");
      if (!currentItems.length) {
        container.innerHTML = `<div class="col-span-full bg-white border border-slate-200 rounded-2xl p-8 text-center text-sm text-slate-400">No entries found for selected filter.</div>`;
        return;
      }

      container.innerHTML = currentItems.map((item, idx) => {
        const maskBadge = item.isMasked
          ? `<span class="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">MASKED</span>`
          : `<span class="text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">${escapeHtml(item.hospId || "UDCP")}</span>`;

        return `
          <button type="button" onclick="openChipModal(${idx})"
            class="text-left bg-white hover:bg-red-50/40 border border-slate-200 hover:border-red-300 rounded-2xl p-4 shadow-sm transition space-y-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-mono text-slate-500">${escapeHtml(item.date || "")}</span>
              ${maskBadge}
            </div>
            <div class="font-black text-sm text-slate-900">${escapeHtml(item.hospitalName)}</div>
            ${item.status ? `<div class="text-xs font-semibold text-slate-600">${escapeHtml(item.status)}</div>` : ""}
          </button>
        `;
      }).join("");
    }

    function openChipModal(idx) {
      const item = currentItems[idx];
      if (!item) return;

      document.getElementById("mdlHospIdBadge").innerText = item.isMasked ? "RESTRICTED" : (item.hospId || "HOSPITAL");
      document.getElementById("mdlHospitalName").innerText = item.hospitalName || "";
      document.getElementById("mdlMetaText").innerText = [item.date, item.status].filter(Boolean).join(" • ");
      document.getElementById("mdlRemarkBox").innerText = item.remark || "No additional remark.";

      const extBox = document.getElementById("mdlExternalLinks");
      const udcpBtn = document.getElementById("mdlUdcpBtn");
      const drvBtn = document.getElementById("mdlDriveBtn");

      let hasAnyLink = false;

      if (!item.isMasked && item.udcpUrl) {
        udcpBtn.href = item.udcpUrl;
        udcpBtn.classList.remove("hidden");
        hasAnyLink = true;
      } else {
        udcpBtn.href = "#";
        udcpBtn.classList.add("hidden");
      }

      if (!item.isMasked && item.driveUrl) {
        drvBtn.href = item.driveUrl;
        drvBtn.classList.remove("hidden");
        hasAnyLink = true;
      } else {
        drvBtn.href = "#";
        drvBtn.classList.add("hidden");
      }

      extBox.classList.toggle("hidden", !hasAnyLink);
      document.getElementById("detailModal").classList.remove("hidden");
    }

    function closeDetailModal() {
      document.getElementById("detailModal").classList.add("hidden");
    }

    window.addEventListener("DOMContentLoaded", () => {
      fetchPortalData({ silent: false });
      setInterval(() => {
        if (document.visibilityState === "visible") {
          fetchPortalData({ silent: true });
        }
      }, BACKGROUND_SYNC_MS);
    });
  </script>
</body>
</html>
